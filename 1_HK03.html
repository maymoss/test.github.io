<!DOCTYPE html>
<head>
  <meta charset="en">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1_HK03作業</title>
  <style>
    #all {
      background-color: aqua;
      width: 600px;
      height: 600px;
    }

    #top {
      background-color: #fbbdca;
      width: 600px;
      height: 150px;
    }

    #mid {
      width: 600px;
      height: 300px;
    }

    #mid-left {
      background-color: #bbb76e;
      width: 150px;
      height: 300px;
      float: left;
    }

    #mid-right {
      background-color: #6c94eb;
      width: 450px;
      height: 300px;
      float: right;
    }

    #mid-right-top {
      background-color: #b1eded;
      width: 450px;
      height: 100px;
    }
    #mid-right-mid {
      background-color: #fbbdca;
      width: 450px;
      height: 100px;
    }
    #mid-right-btm {
      background-color: #6c94eb;
      width: 450px;
      height: 100px;
    }

    #mid-right-top-left{
      background-color: #fbfd30;
      width: 150px;
      height: 100px;
      float: left;
    }

    #mid-right-top-right{
      background-color: #dcb687;
      width: 300px;
      height: 100px;
      float: left;
    }

    #mid-right-mid-left{
      background-color: #7d007f;
      width: 300px;
      height: 100px;
      float: left;
    }

    #mid-right-mid-right{
      background-color: #fa0019;
      width: 150px;
      height: 100px;
      float: left;
    }

    #mid-right-btm-left{
      background-color: #ce6727;
      width: 150px;
      height: 100px;
      float: left;
    }

    #mid-right-btm-right{
      background-color: #678fe6;
      width: 300px;
      height: 100px;
      float: left;
    }

    #btm {
      background-color: #d7a42f;
      width: 600px;
      height: 150px;
    }
  </style>

</head>
<body>
  <div id="all">
    <div id="top"></div>
    <div id="mid">
      <div id="mid-left"></div>
      <div id="mid-right">
        <div id="mid-right-top">
          <div id="mid-right-top-left"></div>
          <div id="mid-right-top-right"></div>
        </div>
        <div id="mid-right-mid">
          <div id="mid-right-mid-left"></div>
          <div id="mid-right-mid-right"></div>
        </div>
        <div id="mid-right-btm">
          <div id="mid-right-btm-left"></div>
          <div id="mid-right-btm-right"></div>
        </div>
      </div>
    </div>
    <div id="btm"></div>
  </div>
</body>
</html>
