<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>personHK01</title>
</head>
<style>

  #box-all {
    background-color: aqua;
    width: calc(80% - 10px*2);
    height: calc(600px - 10px*2);
    margin: auto;
    margin-top: 100px;
    padding: 10px;
  }

  #box-left{
    background-color: #0000ff;
    width: 33%;
    height: 100%;
    margin-right: 10px;
    float: left;
  }

  #box-center{
    background-color: #ff7300;
    width: calc(34% - 10px*2);
    height: 100%;
    margin-right: 10px;    
    float: left;
  }

  #box-right{
    background-color: #ff00dd;
    width: 33%;
    height: 100%;
    float: left;
  }

</style>
<body>
  <div id="box-all">
    <div id="box-left"></div>
    <div id="box-center"></div>
    <div id="box-right"></div>
  </div>
</body>
</html>
