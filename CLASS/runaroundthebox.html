<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .big-box {
    background-color: #80ffff;
    width: 300px;
    height: 300px;
    position: relative;
  }
  .box {
    background-color: #ff80f4;
    width: 50px;
    height: 50px;
    position: absolute;
    
    top: 0;
    left: 0;
    transform: translate(-100%,-100%);

    animation: roll-box;
    animation-duration: 5s;
    animation-iteration-count: infinite;
  }
  .box2 {
    background-color: #8280ff;
    width: 50px;
    height: 50px;
    position: absolute;
    
    top: 0;
    left: 0;
    transform: translate(-100%,-100%);

    animation: roll-box2;
    animation-duration: 2.5s;
    animation-iteration-count: infinite;
  }

  @keyframes roll-box {
    0%{
      top: 0;
      left: 0;
      transform: translate(-100%,-100%);
    }
    25%{
      top: 0;
      left: 100%;
      transform: translate(0,-100%);
    }
    50%{
      top: 100%;
      left: 100%;
      transform: translate(0,0%);
    }
    75%{
      top: 100%;
      left: 0%;
      transform: translate(-100%,0);
    }
    100%{
      top: 0;
      left: 0;
      transform: translate(-100%,-100%);
    }
  }

  @keyframes roll-box2 {
    0%{
      top: 0;
      left: 0;
      transform: translate(-100%,-100%);
    }
    25%{
      top: 0;
      left: 100%;
      transform: translate(0,-100%);
    }
    50%{
      top: 100%;
      left: 100%;
      transform: translate(0,0%);
    }
    75%{
      top: 100%;
      left: 0%;
      transform: translate(-100%,0);
    }
    100%{
      top: 0;
      left: 0;
      transform: translate(-100%,-100%);
    }
  }
</style>
<body>
  <div class="big-box">
    <div class="box"></div>
    <div class="box2"></div>
  </div>


</body>
</html>
