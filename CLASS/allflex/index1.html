<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>allflex</title>
</head>
<style>
  body {
    margin: 0;
  }
  .menu {
    background-color: bisque;
    height: 100vh;
    width: 300px;
    display: flex;
  }
  .main {
    background-color: aquamarine;
    height: 500px;
    width: 800px;
    justify-content: center;
    align-items: center;
    display: flex;
  }
</style>
<body>
  <div class="menu"></div>
  <div class="main"></div>
</body>
</html>
