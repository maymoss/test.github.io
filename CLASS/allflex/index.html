<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作業</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="./css/index.css?v=1.0" rel="stylesheet">
  <link href="https://lanjiji.zapto.org/9ghfo-83t22-001.ico?v=2" rel="icon" type="image/x-icon"/>

</head>

<body>
  <div class="app-container">
    <!-- 導覽選單 -->
    <aside class="menu">
      <!-- 1. 純 CSS 控制的隱藏核取方塊 -->
      <input type="checkbox" id="menuToggle" class="menu-toggle-checkbox" aria-label="切換導覽選單">

      <!-- 2. Label 連結 checkbox -->
      <label for="menuToggle" class="hamburger-btn">
        <span></span>
        <span></span>
        <span></span>
      </label>

      <div class="logo-box" id="logo-box" title="品牌識別 Logo"></div>

      <nav>
        <ul class="nav-links" id="navLinks">
          <li><a href="https://www.yahoo.com.tw" target="_blank" rel="noopener noreferrer">YAHOO</a></li>
          <li><a href="https://google.com" target="_blank" rel="noopener noreferrer">GOOGLE</a></li>
          <li><a href="https://www.cwa.gov.tw/V8/C/" target="_blank" rel="noopener noreferrer">中央氣象署</a></li>
        </ul>
      </nav>
    </aside>

    <!-- 主內容區塊 (星空極光 + RWD 圖片切換) -->
    <main class="main-wrapper">
      <!-- 星雲極光與動態星空背景層 -->
      <div class="nebula-glow"></div><!-- 流動極光星雲層 -->
      <div class="stars-layer-1"></div><!-- 第一層主要星空（大顆星、彩色星） -->
      <div class="stars-layer-2"></div><!-- 第二層背景星空（細碎星星，交錯閃爍） -->

      <div class="cards-container">
        
        <!-- 卡片 X -->
        <div class="card card-x" tabindex="0">
          <picture class="card-picture">
            <source media="(max-width: 576px)" srcset="https://picsum.photos/id/1015/800/400">
            <source media="(max-width: 1279px)" srcset="https://picsum.photos/id/1016/1000/500">
            <img src="https://picsum.photos/id/1015/600/1100" alt="YAHOO" loading="eager">
          </picture>
          <span class="card-label"></span>
        </div>

        <!-- 卡片 Y -->
        <div class="card card-y" tabindex="0">
          <picture class="card-picture">
            <source media="(max-width: 576px)" srcset="https://picsum.photos/id/1043/800/400">
            <source media="(max-width: 1279px)" srcset="https://picsum.photos/id/1040/600/600">
            <img src="https://picsum.photos/id/1018/600/1100" alt="GOOGLE" loading="lazy">
          </picture>
          <span class="card-label"></span>
        </div>

        <!-- 卡片 Z -->
        <div class="card card-z" tabindex="0">
          <picture class="card-picture">
            <source media="(max-width: 576px)" srcset="https://picsum.photos/id/1056/800/400">
            <source media="(max-width: 1279px)" srcset="https://picsum.photos/id/1050/600/600">
            <img src="https://picsum.photos/id/1025/600/1100" alt="中央氣象署" loading="lazy">
          </picture>
          <span class="card-label"></span>
        </div>

      </div>
    </main>
  </div>
</body>
</html>
