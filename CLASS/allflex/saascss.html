<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    @keyframes right {
      0% {
        left: -100%;
      }
      50%, 100% {
        left: 100%;
      }      
    }
    @keyframes bottom {
      0% {
        top: -100%;
      }
      50%, 100% {
        top: 100%;
      }      
    }
    @keyframes left {
      0% {
        right: -100%;
      }
      50%, 100% {
        right: 100%;
      }      
    }
    @keyframes top {
      0% {
        top: 100%;
      }
      50%, 100% {
        top: -100%;
      }      
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }
    
    .container {
      background-color: black;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      .box {
        background-color: aliceblue;
        width: 300px;
        height: 300px;
        position: relative;
        overflow: hidden;

        justify-content: center;
        align-items: center;
        display: flex;

        .line-1 {
          background: linear-gradient(to right, transparent, orange);
          width: 100%;
          height: 10px;

          position: absolute;
          /* left: -100%; */
          top: 0;
          /* animation: name duration timing-function delay iteration-count direction fill-mode; */
          animation: right 2s linear 0s infinite;
        }
        .line-2 {
          background: linear-gradient(to bottom, transparent, orange);
          width: 10px;
          height: 100%;
        
          position: absolute;
          right: 0;
          top: -100%;
          /* animation: name duration timing-function delay iteration-count direction fill-mode; */
          animation: bottom 2s linear 0.5s infinite;
        }
        .line-3 {
          background: linear-gradient(to left, transparent, orange);
          width: 100%;
          height: 10px;
        
          position: absolute;
          right: 100%;
          bottom: 0;
          /* animation: name duration timing-function delay iteration-count direction fill-mode; */
          animation: left 2s linear 1s infinite;
        }
        .line-4 {
          background: linear-gradient(to top, transparent, orange);
          width: 10px;
          height: 100%;
        
          position: absolute;
          left: 0;
          bottom: -100%;
          /* animation: name duration timing-function delay iteration-count direction fill-mode; */
          animation: top 2s linear 1.5s infinite;
        }
        h1{
          color: blueviolet;
          width: 0;
          overflow: hidden;
          animation: loding 2s linear 1.5s infinite alternate;
        }
        &:hover{
          box-shadow: 0px 0px 300px 150px rgb(247, 246, 246);
        }
      }
    }
    
    @keyframes loding {
      100% {
        width: 130px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">
      <div class="line line-1"></div>
      <div class="line line-2"></div>
      <div class="line line-3"></div>
      <div class="line line-4"></div>
      <h1>loading...</h1>
    </div>
  </div>
</body>
</html>
