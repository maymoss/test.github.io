<!DOCTYPE html>
<html>
<head>
  <meta charset="en">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> <!-- 使用cdnjs套件 -->
  <title>Facebook_Brooks99</title>
</head>

<style>
  body {
  margin: 0;
  padding: 0;
  height: 100vh;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: #18191a;
  color: #e4e6eb;
  overflow: hidden;
}

/* 側邊欄捲軸樣式 */
::-webkit-scrollbar {
  width: 8px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background-color: transparent;
  border-radius: 4px;
}
body:hover::-webkit-scrollbar-thumb {
  background-color: #4e4f50;
}

/* ================= 頂部導覽列 (Navbar) ================= */
#navbermain {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 56px;
  background: #242526;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  border-bottom: 1px solid #393a3b;
  z-index: 1000;
  box-sizing: border-box;
}

#nav-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  max-width: 320px;
}

#nav-left #logo {
  color: #0866ff;
  font-size: 42px;
  cursor: pointer;
  display: flex;
  align-items: center;
  line-height: 1;
}

#search-box {
  background: #3a3b3c;
  display: flex;
  align-items: center;
  padding: 0 12px;
  height: 40px;
  border-radius: 50px;
  gap: 10px;
  width: 100%;
  max-width: 240px;
  box-sizing: border-box;
}

#search-box input {
  border: none;
  background: transparent;
  outline: none;
  font-size: 15px;
  width: 100%;
  color: #e4e6eb;
}

#search-box input::placeholder {
  color: #b0b3b8;
}

.nav-center {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100%;
  flex: 2;
  max-width: 680px;
  gap: 6px;
}

.nav-tab {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  max-width: 112px;
  min-width: 50px;
  height: 100%;
  cursor: pointer;
  color: #b0b3b8;
  position: relative;
  transition: color 0.15s ease;
  box-sizing: border-box;
}

.nav-tab .icon-btn {
  background: transparent;
  width: 100%;
  height: calc(100% - 8px);
  margin: 4px 0;
  border-radius: 8px;
  color: inherit;
  transition: background-color 0.15s ease;
}

.nav-tab:hover .icon-btn {
  background: #3a3b3c;
}

.nav-tab svg {
  width: 28px;
  height: 28px;
}

.nav-tab.active {
  color: #0866ff;
}

.nav-tab.active::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 3px;
  background-color: #0866ff;
  border-top-left-radius: 4px;
  border-top-right-radius: 4px;
}

#nav-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  justify-content: flex-end;
}

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #3a3b3c;
  color: #e4e6eb;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  border: none;
  outline: none;
  transition: background-color 0.15s ease, filter 0.15s ease;
  box-sizing: border-box;
}

.icon-btn:hover {
  background: #4e4f50;
}

#nav-right .icon-btn svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

.icon-btn img,
.icon-btn image {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: block;
}

/* ================= 主版面配置 (Main 三欄版型) ================= */
#main {
  margin-top: 56px;
  display: grid;
  grid-template-columns: 360px 1fr 360px;
  height: calc(100vh - 56px);
  width: 100vw;
  overflow: hidden;
  box-sizing: border-box;
}

#main-left, 
#main-right {
  padding: 16px 8px 32px 8px;
  overflow-y: auto;
  height: 100%;
  user-select: none;
  box-sizing: border-box;
}

#main-center {
  padding: 16px;
  overflow-y: auto;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  box-sizing: border-box;
}

/* ================= 左側邊欄細節 ================= */
.menu-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 500;
  color: #e4e6eb;
  transition: background-color 0.15s ease;
  box-sizing: border-box;
}

.menu-item:hover {
  background-color: #3a3b3c;
}

.menu-item:active {
  background-color: #4e4f50;
}

.menu-item img {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  object-fit: cover;
  flex-shrink: 0;
}

.menu-item img.avatar {
  border-radius: 50%;
}

.menu-item i[data-visualcompletion="css-img"] {
  flex-shrink: 0;
}

.menu-item span {
  font-size: 15px;
  line-height: 1.3;
  overflow: hidden;
}

.menu-icon-wrap {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #3a3b3c;
  flex-shrink: 0;
  box-sizing: border-box;
}

#main-left hr {
  border: none;
  border-top: 1px solid #393a3b;
  margin: 12px 10px;
}

#main-left h3 {
  margin: 0;
  padding: 8px 10px 4px 10px;
  font-size: 17px;
  font-weight: 600;
  color: #b0b3b8;
  box-sizing: border-box;
}

#main-left footer {
  padding: 16px 10px 0 10px;
  font-size: 13px;
  color: #b0b3b8;
  box-sizing: border-box;
}

#main-left footer ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px 4px;
}

#main-left footer li {
  display: inline-flex;
  align-items: center;
}

#main-left footer a {
  color: #b0b3b8;
  text-decoration: none;
  line-height: 1.4;
}

#main-left footer a:hover,
#main-left footer div[role="button"]:hover {
  text-decoration: underline;
  cursor: pointer;
}

/* ================= 響應式斷點 (RWD) ================= */
@media (max-width: 1100px) {
  #main {
    grid-template-columns: 300px 1fr;
  }
  #main-right {
    display: none;
  }
}

@media (max-width: 900px) {
  #search-box {
    width: 40px;
    padding: 0;
    justify-content: center;
    background: #3a3b3c;
  }
  #search-box input {
    display: none;
  }
  .nav-center {
    gap: 2px;
  }
}

@media (max-width: 768px) {
  #main {
    grid-template-columns: 1fr;
  }
  #main-left {
    display: none;
  }
  .nav-center {
    display: none;
  }
  #nav-left {
    max-width: fit-content;
  }
}
</style>

<script>
  document.addEventListener('DOMContentLoaded',function (){
    const nanoItems = document.querySelectorAll('.main-left-menuitem-shownano');
    const btnmain_left_menu_showlittle = document.getElementById('main-left-menu-showlittle');
    const btnmain_left_menu_showmore = document.getElementById('main-left-menu-showmore');

    // 1. 預設狀態：隱藏 nano 項目與「顯示較少」按鈕
    nanoItems.forEach(item => {
      item.style.display = 'none';
    });
    if (btnmain_left_menu_showlittle) btnmain_left_menu_showlittle.style.display = 'none';

    // 2. 點擊「顯示更多」：顯示項目，並切換按鈕顯示狀態
    btnmain_left_menu_showmore.addEventListener('click', function () {
      nanoItems.forEach(item => {
        // 依你的項目版型決定，通常 FB 選單項目為 'flex' 或 'block'
        item.style.display = 'flex';
      });
      btnmain_left_menu_showmore.style.display = 'none';
      btnmain_left_menu_showlittle.style.display = 'flex';
    });

    // 3. 點擊「顯示較少」：隱藏項目，並切換按鈕顯示狀態
    btnmain_left_menu_showlittle.addEventListener('click', function () {
      nanoItems.forEach(item => {
        item.style.display = 'none';
      });
      btnmain_left_menu_showlittle.style.display = 'none';
      btnmain_left_menu_showmore.style.display = 'flex';
    });
  });
</script>
