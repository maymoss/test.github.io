<!DOCTYPE html>
<head>
  <meta charset="en">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1_HK04作業</title>
  <style>
    #all {
      background-color: aqua;
      width: 600px;
      height: 800px;
    }

    #top {
      background-color: #fbbdca;
      width: 600px;
      height: 150px;
    }

    #mid {
      width: 600px;
      height: 500px;
    }

    #mid-left {
      background-color: #bbb76e;
      width: 450px;
      height: 500px;
      float: left;
    }

    #mid-left-top{
      background-color: #bbb76e;
      width: 450px;
      height: 300px;
      float: left;
    }

    #mid-left-top-left{
      background-color: #eb7e81;
      width: 150px;
      height: 300px;
      float: left;
    }

    #mid-left-top-right{
      background-color: #282c34;
      width: 300px;
      height: 300px;
      float: left;
    }

    #mid-left-top-right-top{
      background-color: #6b828f;
      width: 300px;
      height: 100px;
    }

    #mid-left-top-right-mid{
      background-color: #282c34;
      width: 300px;
      height: 100px;
    }

    #mid-left-top-right-btm{
      background-color: #98c379;
      width: 300px;
      height: 100px;
    }

    #mid-left-mid{
      background-color: #93ec90;
      width: 450px;
      height: 100px;
      float: left;
    }

    #mid-left-btm{
      background-color: #8bcbf7;
      width: 450px;
      height: 100px;
      float: left;
    }

    #mid-right {
      background-color: #6c94eb;
      width: 150px;
      height: 500px;
      float: right;
    }

    #btm {
      background-color: #d7a42f;
      width: 600px;
      height: 150px;
    }
  </style>

</head>
<body>
  <div id="all">
    <div id="top"></div>
    <div id="mid">
      <div id="mid-left">
        <div id="mid-left-top">
          <div id="mid-left-top-left"></div>
          <div id="mid-left-top-right">
            <div id="mid-left-top-right-top"></div>
            <div id="mid-left-top-right-mid"></div>
            <div id="mid-left-top-right-btm"></div>
          </div>
        </div>
        <div id="mid-left-mid"></div>
        <div id="mid-left-btm"></div>
      </div>
      <div id="mid-right"></div>
    </div>
    <div id="btm"></div>
  </div>
</body>
</html>
