<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    #allbox {
      background-color: rgb(223, 219, 120);
      width: calc(640px - 10px*2);
      height: calc(620px - 10px*2);
      padding: 10px;
    }
    #box-left {
      background-color: rgb(170, 57, 43);
      width: 200px;
      height: 600px;
      float: left;
      margin-right: 10px;
    }
    #box-center {
      background-color: rgb(78, 164, 235);
      width: 200px;
      height: 600px;
      float: left;
      margin-right: 10px;
    }
    #box-right {
      background-color: rgb(185, 52, 163);
      width: 200px;
      height: 600px;
      float: left;
    }

  </style>
</head>

<body>
  <div id="allbox">
    <div id="box-left"></div>
    <div id="box-center"></div>
    <div id="box-right"></div>
  </div>
  
</body>

</html>
