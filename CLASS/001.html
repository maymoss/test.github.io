<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1015-EX1</title>
    <style>
        #all {
            background-color: aqua;
            width: 80%;
            height: calc(600px - 10px * 2);
            padding: 10px;
            margin: auto;
        }

        #top {
            background-color: pink;
            width: 100%;
            height: 20%;

        }

        #mid {
            background-color: aqua;
            width: 100%;
            height: calc(60% - 10px * 2);
            margin-top: 10px;
        }

        #mid-left {
            background-color: gray;
            width: 34%;
            height: 100%;
            float: left;
            
        }

        #mid-right {
            background-color:aqua;
            width: calc(66% - 10px * 1);
            height: 100%;
            float: left;
            margin-left: 10px;
     
        }

        #mid-right-1 {
            background-color: green;
            width: 100%;
            height: calc(34% - 10px *1);
        }

        #mid-right-2 {
            background-color: red;
            width: 100%;
            height: 32%;
            margin-top: 10px;
        }

        #mid-right-3 {
            background-color: blue;
            width: 100%;
            height: calc(34% - 10px *1);
            margin-top: 10px;
        }

        #btm {
            background-color: orange;
            width: 100%;
            height: 20%;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div id="all">
        <div id="top"></div>
        <div id="mid">
            <div id="mid-left"></div>
            <div id="mid-right">
                <div id="mid-right-1"></div>
                <div id="mid-right-2"></div>
                <div id="mid-right-3"></div>
            </div>
        </div>
        <div id="btm"></div>
    </div>
</body>

</html>
