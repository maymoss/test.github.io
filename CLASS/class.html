<!DOCTYPE html>
<head>
  <meta charset="en">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>課程教學</title>
  <style>
    #all {
      background-color: aqua;
      width: 600px;
      height: 600px;
    }

    #top {
      background-color: red;
      width: 600px;
      height: 100px;
    }

    #mid {
      background-color: yellow;
      width: 600px;
      height: 400px;
    }

    #mid-left {
      background-color: rgb(247, 0, 255);
      width: 200px;
      height: 100px;
      float: left;
    }    

    #mid-left-1 {
      background-color: rgb(0, 225, 255);
      width: 200px;
      height: 100px;

    }

    #mid-left-2 {
      background-color: rgb(17, 0, 255);
      width: 200px;
      height: 100px;
    }

    #mid-left-3 {
      background-color: rgb(255, 0, 0);
      width: 200px;
      height: 100px;
    }

    #mid-left-4 {
      background-color: rgb(247, 0, 255);
      width: 200px;
      height: 100px;
    }

    #mid-right {
      background-color: rgb(255, 94, 0);
      width: 200px;
      height: 400px;
      float: right;
    }

    #btm {
      background-color: blue;
      width: 600px;
      height: 100px;
    }
  </style>

</head>
<body>
  <div id="all">
    <div id="top"></div>
    <div id="mid">
      <div id="mid-left">
        <div id="mid-left-1"></div>
        <div id="mid-left-2"></div>
        <div id="mid-left-3"></div>
        <div id="mid-left-4"></div>
      </div>
      <div id="mid-right"></div>
    </div>
    <div id="btm"></div>
  </div>
</body>
</html>
