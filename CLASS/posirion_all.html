<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      margin: 0;
      margin-top: 10px;
      margin-left: 10px;
    }

    #boxall {
      background-color: aqua;
      width: 500px;
      height: 500px;
      /* 單純只拿來當作定位系統 */
      position: relative;
    }

    #box-1 {
      background-color: rgb(0, 4, 255);
      width: 50px;
      height: 50px;
      /* 單純只拿來當作定位系統 */
      position: absolute;
      left: calc(50% - 50px/2);
      top: calc(50% - 50px/2);
    }

    #box-2 {
      background-color: rgb(0, 119, 255);
      width: 50px;
      height: 50px;
      /* 單純只拿來當作定位系統 */
      position: absolute;
      left: calc(50% - 50px/2);
      top: 0;
    }

    #box-3 {
      background-color: rgb(209, 176, 66);
      width: 50px;
      height: 50px;
      /* 單純只拿來當作定位系統 */
      position: absolute;
      right: 50%;
      bottom: 0;
    }

    #box-4 {
      background-color: rgb(176, 50, 226);
      width: 50px;
      height: 50px;
      /* 單純只拿來當作定位系統 */
      position: absolute;
      right: -25px;
      top: calc(50% - 50px/2);
    }

    #box-5 {
      background-color: rgb(228, 94, 194);
      width: 50px;
      height: 50px;
      /* 單純只拿來當作定位系統 */
      position: absolute;
      right: 0;
      bottom: 0;
    }

    #box-6 {
      background-color: rgb(138, 70, 121);
      width: 50px;
      height: 50px;
      /* 單純只拿來當作定位系統 */
      position: absolute;
      left: 0;
      top: calc(50% - 50px/2);
    }

    #box-7 {
      background-color: rgb(104, 236, 155);
      width: 50px;
      height: 50px;
      /* 單純只拿來當作定位系統 */
      position: absolute;
      right: 0;
      top: calc(50% - 50px/2);
    }

    #box-8 {
      background-color: rgb(134, 111, 111);
      width: 50px;
      height: 50px;
      /* 單純只拿來當作定位系統 */
      position: absolute;
      left: 0;
      bottom: -25px;
    }

  </style>
</head>

<body>
  <div id="boxall">
    <div id="box-1">1</div>
    <div id="box-2">2</div>
    <div id="box-3">3</div>
    <div id="box-4">4</div>
    <div id="box-5">5</div>
    <div id="box-6">6</div>
    <div id="box-7">7</div>
    <div id="box-8">8</div>
  </div>
</body>

</html>
