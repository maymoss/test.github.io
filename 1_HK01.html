<!DOCTYPE html>
<head>
  <meta charset="en">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1_HK01作業</title>
  <style>
    #all {
      background-color: aqua;
      width: 600px;
      height: 600px;
    }

    #top {
      background-color: #fbbdca;
      width: 600px;
      height: 150px;
    }

    #mid {
      width: 600px;
      height: 300px;
    }

    #mid-left {
      background-color: #bbb76e;
      width: 300px;
      height: 300px;
      float: left;
    }

    #mid-right {
      background-color: #6c94eb;
      width: 300px;
      height: 300px;
      float: right;
    }

    #btm {
      background-color: #d7a42f;
      width: 600px;
      height: 150px;
    }
  </style>

</head>
<body>
  <div id="all">
    <div id="top"></div>
    <div id="mid">
      <div id="mid-left"></div>
      <div id="mid-right"></div>
    </div>
    <div id="btm"></div>
  </div>
</body>
</html>
