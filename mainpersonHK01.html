<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mainpersonHK01</title>
</head>
<style>
  #all{
    background-color: #f3a6f3;
    width: calc(80% - 10px*2);
    height: calc(600px - 10px*2);
    margin: auto;
    margin-top: 100px;
    padding: 10px;
  }
  #header {
    background-color: #fa61ad;
    width: 100%;
    height: 20%;
    margin-bottom: 10px;
  }
  #main {
    /* background-color: #6178fa; */
    width: 100%;
    height: calc(60% - 10px*2);
    margin-bottom: 10px;
  }

  #main-left {
    background-color: rgb(131, 194, 194);
    width: 34%;
    height: 100%;
    float: left;
    margin-right: 10px;
  }

  #main-right {
    /* background-color: rgb(62, 231, 231); */
    width: calc(66% - 10px);
    height: 100%;
    float: left;
  }

  #main-right-top {
    background-color: bisque;
    width: 100%;
    height: calc(34% - 10px);
    margin-bottom: 10px;
  }
  #main-right-mid {
    background-color: rgba(238, 143, 26, 0.986);
    width: 100%;
    height: 32%;
    margin-bottom: 10px;
  }
  #main-right-btm {
    background-color: rgb(182, 134, 76);
    width: 100%;
    height: calc(34% - 10px);
  }
  
  #footer {
    background-color: #3f2308;
    width: 100%;
    height: 20%;
  }

</style>
<body>
  <div id="all">
    <div id="header"></div>
    <div id="main">
      <div id="main-left"></div>
      <div id="main-right">
        <div id="main-right-top"></div>
        <div id="main-right-mid"></div>
        <div id="main-right-btm"></div>
      </div>
    </div>
    <div id="footer"></div>
  </div>
</body>
</html>
